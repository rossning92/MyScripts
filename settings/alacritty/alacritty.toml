[general]
import = [
  "~/.config/alacritty/current-theme.toml",
  "~/AppData/Roaming/alacritty/current-theme.toml",
  # macOS-only font size. setup_alacritty() symlinks font-mac.toml here only on
  # macOS. on Linux/Windows this path is absent and the import is skipped.
  "~/.config/alacritty/font-mac.toml",
]

[selection]
save_to_clipboard = true

[mouse]
bindings = [
  { mouse = "Right", action = "Paste" },
]

[window.dimensions]
columns = 120
lines = 40

[window]
padding.x = 0
padding.y = 0
# macOS: treat Option as Alt instead of typing accented characters.
# "Both" = both Option keys; use "OnlyLeft"/"OnlyRight" to keep one for accents.
option_as_alt = "Both"

[keyboard]
bindings = [
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },

  # Ctrl+Win+key sends Ctrl+A, then that key (for tmux-style prefixes).
  { key = "0", mods = "Control|Super", chars = "\u00010" },
  { key = "1", mods = "Control|Super", chars = "\u00011" },
  { key = "2", mods = "Control|Super", chars = "\u00012" },
  { key = "3", mods = "Control|Super", chars = "\u00013" },
  { key = "4", mods = "Control|Super", chars = "\u00014" },
  { key = "5", mods = "Control|Super", chars = "\u00015" },
  { key = "6", mods = "Control|Super", chars = "\u00016" },
  { key = "7", mods = "Control|Super", chars = "\u00017" },
  { key = "8", mods = "Control|Super", chars = "\u00018" },
  { key = "9", mods = "Control|Super", chars = "\u00019" },
  { key = "A", mods = "Control|Super", chars = "\u0001a" },
  { key = "B", mods = "Control|Super", chars = "\u0001b" },
  { key = "C", mods = "Control|Super", chars = "\u0001c" },
  { key = "D", mods = "Control|Super", chars = "\u0001d" },
  { key = "E", mods = "Control|Super", chars = "\u0001e" },
  { key = "F", mods = "Control|Super", chars = "\u0001f" },
  { key = "G", mods = "Control|Super", chars = "\u0001g" },
  { key = "H", mods = "Control|Super", chars = "\u0001h" },
  { key = "I", mods = "Control|Super", chars = "\u0001i" },
  { key = "J", mods = "Control|Super", chars = "\u0001j" },
  { key = "K", mods = "Control|Super", chars = "\u0001k" },
  { key = "L", mods = "Control|Super", chars = "\u0001l" },
  { key = "M", mods = "Control|Super", chars = "\u0001m" },
  { key = "N", mods = "Control|Super", chars = "\u0001n" },
  { key = "O", mods = "Control|Super", chars = "\u0001o" },
  { key = "P", mods = "Control|Super", chars = "\u0001p" },
  { key = "Q", mods = "Control|Super", chars = "\u0001q" },
  { key = "R", mods = "Control|Super", chars = "\u0001r" },
  { key = "S", mods = "Control|Super", chars = "\u0001s" },
  { key = "T", mods = "Control|Super", chars = "\u0001t" },
  { key = "U", mods = "Control|Super", chars = "\u0001u" },
  { key = "V", mods = "Control|Super", chars = "\u0001v" },
  { key = "W", mods = "Control|Super", chars = "\u0001w" },
  { key = "X", mods = "Control|Super", chars = "\u0001x" },
  { key = "Y", mods = "Control|Super", chars = "\u0001y" },
  { key = "Z", mods = "Control|Super", chars = "\u0001z" },

  # Disable F1–F12 keys
  { key = "F1",  action = "None" },
  { key = "F2",  action = "None" },
  { key = "F3",  action = "None" },
  { key = "F4",  action = "None" },
  { key = "F5",  action = "None" },
  { key = "F6",  action = "None" },
  { key = "F7",  action = "None" },
  { key = "F8",  action = "None" },
  { key = "F9",  action = "None" },
  { key = "F10", action = "None" },
  { key = "F11", action = "None" },
  { key = "F12", action = "None" },
]
